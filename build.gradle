plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Midnightlib
	maven {
		url = "https://maven.midnightdust.eu/releases"
	}

	//trinkets
	maven {
		name = "Nucleoid"
		url = 'https://maven.nucleoid.xyz/releases'
	}

	//ladysnake
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}

	//maven {
	//	url = "https://api.modrinth.com/maven"
	//}

	// Mod Menu
	maven { url "https://maven.terraformersmc.com/releases/" }

		exclusiveContent {
			forRepository {
				maven {
					name = 'GeckoLib'
					url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
				}
			}
			filter { includeGroupAndSubgroups('com.geckolib') }
		}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.terraformersmc:modmenu:18.0.0-alpha.8")
	implementation include ("eu.midnightdust:midnightlib:1.9.2+26.1-fabric")

	implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolibVersion}"
	//implementation "maven.modrinth:detail-armor-bar-reconstructed:5.2.1+26.1-fabric"

	implementation "eu.pb4:trinkets:${trinkets_version}"
	runtimeOnly "eu.pb4:trinkets:${trinkets_version}"

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}